[pytest]
; app.py / session_store.py / db.py are plain top-level modules (not a
; package), and tests/ has no __init__.py — without this, pytest's default
; import-mode wouldn't put backend/ itself on sys.path, and `import app`
; inside the tests would fail regardless of which directory pytest is
; invoked from.
pythonpath = .
testpaths = tests
